; Flight-info companion display
; Boards:
;   Waveshare ESP32-S3-Touch-AMOLED-2.16 (ESP32-S3R8, 16MB flash, 8MB OPI PSRAM,
;        480x480 CO5300 AMOLED over QSPI, CST9220 touch, AXP2101 PMU)
;   Waveshare ESP32-C6-Touch-AMOLED-2.16 (ESP32-C6, 16MB flash, NO PSRAM,
;        same panel/touch/PMU/codec on different GPIOs) - the "-c6" envs
;
; Build environments (S3 / C6):
;   amoled216   / amoled216-c6   - personal/dev build, talks to a LAN server over HTTP
;   product     / product-c6     - retail build, pinned to https://api.aeroblip.com with the
;                                  Let's Encrypt root CA, OTA enabled (flash via tools/flash_product.py)
;   product-dev / product-dev-c6 - product behaviour against a LAN server
;
; Firmware version lives in [common] - bump it before an OTA release
; (tools/flash_product.py reads it from here).

[common]
fw_version = 0.10.5

[base]
; pioarduino platform build: ships arduino-esp32 core 3.x, which
; GFX Library for Arduino 1.6.x requires (official espressif32 stops at 2.x)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
; default_16MB has two app slots (app0/app1) - required for OTA
board_build.partitions = default_16MB.csv

upload_port = COM5
monitor_port = COM5
monitor_speed = 115200

build_flags =
    -DBOARD_HAS_PSRAM
    ; native USB-Serial/JTAG console (the board's only USB port)
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DFW_VERSION=\"${common.fw_version}\"

lib_deps =
    moononournation/GFX Library for Arduino@1.6.4
    lewisxhe/SensorLib@0.3.3
    bblanchon/ArduinoJson@^7.2.0
    tzapu/WiFiManager@^2.0.17
    lewisxhe/XPowersLib@^0.2.6
    gilmaimon/ArduinoWebsockets@^0.5.4
    bitbank2/JPEGDEC@^1.8.2
    ricmoo/QRCode@^0.0.1

[env:amoled216]
extends = base

[env:product]
extends = base
build_flags =
    ${base.build_flags}
    -DPRODUCT_BUILD=1
    -DPRODUCT_SERVER_URL=\"https://api.aeroblip.com\"

[env:product-dev]
extends = base
build_flags =
    ${base.build_flags}
    -DPRODUCT_BUILD=1
    -DPRODUCT_SERVER_URL=\"http://192.168.1.100:8000\"

; ---------------------------------------------------------------------------
; ESP32-C6 board. Same source, different chip: RISC-V single core, 16MB flash,
; no PSRAM (328 KB heap). -DNO_FRAMEBUFFER makes the UI draw straight to the
; panel instead of through a 460 KB canvas; aircraft photos and airline logos
; (PSRAM-only buffers) are skipped and IMU auto-rotation is off.
; Port auto-detects (no upload_port) - pass --upload-port to pin one.
[c6base]
platform = ${base.platform}
board = esp32-c6-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

monitor_speed = 115200

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DFW_VERSION=\"${common.fw_version}\"
    -DNO_FRAMEBUFFER=1

lib_deps = ${base.lib_deps}

[env:amoled216-c6]
extends = c6base

[env:product-c6]
extends = c6base
build_flags =
    ${c6base.build_flags}
    -DPRODUCT_BUILD=1
    -DPRODUCT_SERVER_URL=\"https://api.aeroblip.com\"

[env:product-dev-c6]
extends = c6base
build_flags =
    ${c6base.build_flags}
    -DPRODUCT_BUILD=1
    -DPRODUCT_SERVER_URL=\"http://192.168.1.100:8000\"