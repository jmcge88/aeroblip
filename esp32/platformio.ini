; Flight-info companion display
; Board: Waveshare ESP32-S3-Touch-AMOLED-2.16 (ESP32-S3R8, 16MB flash, 8MB OPI PSRAM,
;        480x480 CO5300 AMOLED over QSPI, CST9220 touch, AXP2101 PMU)
;
; Two build environments:
;   amoled216 - personal/dev build, talks to a LAN server over HTTP
;   product   - retail build, pinned to https://api.aeroblip.com with the
;               Let's Encrypt root CA, OTA enabled (flash via tools/flash_product.py)

[base]
; pioarduino platform build: ships arduino-esp32 core 3.x, which
; GFX Library for Arduino 1.6.x requires (official espressif32 stops at 2.x)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
; default_16MB has two app slots (app0/app1) - required for OTA
board_build.partitions = default_16MB.csv

upload_port = COM5
monitor_port = COM5
monitor_speed = 115200

build_flags =
    -DBOARD_HAS_PSRAM
    ; native USB-Serial/JTAG console (the board's only USB port)
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DFW_VERSION=\"0.9.9\"

lib_deps =
    moononournation/GFX Library for Arduino@1.6.4
    lewisxhe/SensorLib@0.3.3
    bblanchon/ArduinoJson@^7.2.0
    tzapu/WiFiManager@^2.0.17
    lewisxhe/XPowersLib@^0.2.6
    gilmaimon/ArduinoWebsockets@^0.5.4
    bitbank2/JPEGDEC@^1.8.2
    ricmoo/QRCode@^0.0.1

[env:amoled216]
extends = base

[env:product]
extends = base
build_flags =
    ${base.build_flags}
    -DPRODUCT_BUILD=1
    -DPRODUCT_SERVER_URL=\"https://api.mypublicdomain.com\"

[env:product-dev]
extends = base
build_flags =
    ${base.build_flags}
    -DPRODUCT_BUILD=1
    -DPRODUCT_SERVER_URL=\"http://192.168.1.100:8000\"