<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0e14">
  <title>Flight Board</title>
  <!-- Leaflet is vendored, not hotlinked: a CDN compromise would otherwise get
       script execution on every dashboard, and a LAN kiosk should not need the
       internet to render its own map chrome. static/vendor/README.md records
       the version and the upstream SRI hashes these files were checked against. -->
  <link rel="stylesheet" href="/static/vendor/leaflet.css?v=1.9.4">
  <link rel="stylesheet" href="/static/style.css?v=27">
</head>
<body>
  <header id="header">
    <div id="view-title">OVERHEAD</div>
    <div id="clock">--:--:--</div>
  </header>

  <main>
    <!-- Squawk 7500/7600/7700 emergency takeover -->
    <section id="emergency-view" class="view hidden">
      <div id="em-banner"></div>
      <div class="em-body">
        <div id="em-info"></div>
        <div id="em-map"></div>
      </div>
    </section>

    <!-- Spotlight: a single flight directly overhead -->
    <section id="spotlight-view" class="view hidden"></section>

    <!-- Nearby traffic list -->
    <section id="radar-view" class="view">
      <div id="aircraft-list"></div>
      <div id="radar-empty" class="hidden">
        <div class="empty-msg">CLEAR SKIES</div>
      </div>
    </section>

    <!-- Follow-a-flight: a followed callsign tracked anywhere in the world -->
    <section id="follow-view" class="view hidden">
      <div class="fl-body">
        <div id="follow-info"></div>
        <div id="follow-map"></div>
      </div>
    </section>

    <!-- Airport board view -->
    <section id="board-view" class="view hidden">
      <div class="board-header">
        <span id="board-direction">DEPARTURES</span>
        <span id="board-airport"></span>
      </div>
      <!-- METAR/TAF strip (aviationweather.gov via /api/wx); hidden when
           there's no station data -->
      <div id="board-wx" class="hidden"></div>
      <table class="board-table">
        <thead>
          <tr>
            <th class="col-time">TIME</th>
            <th class="col-flight">FLIGHT</th>
            <th class="col-city">CITY</th>
            <th class="col-gate">GATE</th>
            <th class="col-status">STATUS</th>
          </tr>
        </thead>
        <tbody id="board-rows"></tbody>
      </table>
    </section>
  </main>

  <footer id="footer">
    <span id="status-line">connecting…</span>
    <button id="flyover-btn" class="hidden">SIMULATE FLYOVER</button>
    <button id="em-btn" class="hidden">SIMULATE 7700</button>
    <span id="mock-badge" class="hidden">DEMO DATA</span>
    <span id="data-credit" style="opacity:.55">flight data &copy;
      <a href="https://adsb.lol" style="color:inherit">adsb.lol</a> contributors (ODbL)</span>
    <span id="footer-nav"><span id="flip-count"></span><nav id="page-dots"></nav>
      <button id="follow-btn" class="ftr-btn" title="Follow a flight">&#9992;</button>
      <button id="voice-btn" class="ftr-btn" title="Voice announcements">&#128263;</button>
      <button id="stats-btn" class="ftr-btn" title="Spotting log">&#9636;</button>
      <button id="watch-btn" class="ftr-btn" title="Watch list">&#9673;</button>
      <button id="loc-btn" class="ftr-btn" title="Set view location">&#8982;</button></span>
  </footer>

  <!-- Watch-rule matches pop up here (and go to ntfy/webhook server-side) -->
  <div id="toasts"></div>

  <!-- Spotting log: stats + heatmap/replay, fed by /api/stats and
       /api/history/tracks. Opened from the footer; not part of the page
       rotation. -->
  <div id="stats-overlay" class="hidden">
    <div class="stats-head">
      <span class="stats-title">SPOTTING LOG</span>
      <span id="stats-cell"></span>
      <button id="wrap-btn" type="button" title="Monthly wrap-up">MONTHLY WRAP</button>
      <button id="stats-close">&#10005;</button>
    </div>
    <div id="stats-body"><div class="empty-msg loading"><span class="spinner"></span>LOADING…</div></div>
  </div>

  <!-- Follow a flight: per-callsign global trackers on the server -->
  <div id="follow-panel" class="ftr-panel hidden">
    <h3>FOLLOW A FLIGHT<button class="panel-close" type="button" aria-label="Close">&#10005;</button></h3>
    <div id="follow-list"></div>
    <label for="follow-cs">Callsign (ICAO, e.g. QFA12)</label>
    <input id="follow-cs" maxlength="8" placeholder="QFA12">
    <div class="loc-row">
      <button id="follow-add" type="button">Follow</button>
    </div>
    <p id="follow-note"></p>
  </div>

  <!-- Watch list: server-side rules; matches toast here and push via
       ntfy/webhook if the server has NTFY_URL / WEBHOOK_URL configured. -->
  <div id="watch-panel" class="ftr-panel hidden">
    <h3>WATCH LIST<button class="panel-close" type="button" aria-label="Close">&#10005;</button></h3>
    <div id="watch-rules"></div>
    <label for="watch-field">Watch for</label>
    <select id="watch-field">
      <option value="type">Aircraft type (ICAO code)</option>
      <option value="airline">Airline (IATA code or name)</option>
      <option value="callsign">Callsign prefix</option>
      <option value="registration">Registration</option>
      <option value="hex">Hex / Mode-S</option>
      <option value="circling">Circling aircraft</option>
      <option value="squawk">Any emergency squawk</option>
      <option value="new_type">First-ever aircraft type</option>
      <option value="military">Military aircraft</option>
      <option value="interesting">Notable aircraft (military, special)</option>
      <option value="go_around">Go-around at the airport</option>
    </select>
    <label for="watch-value" id="watch-value-label">Value</label>
    <input id="watch-value" placeholder="A388">
    <label for="watch-within">Only within NM (optional)</label>
    <input id="watch-within" type="number" min="1" max="500" placeholder="any distance">
    <label class="watch-check"><input id="watch-overhead" type="checkbox"> overhead only</label>
    <label class="watch-check"><input id="watch-golden" type="checkbox"> golden light only</label>
    <div class="loc-row">
      <button id="watch-add" type="button">Add watch</button>
    </div>
    <p id="watch-note"></p>
  </div>

  <div id="loc-panel" class="ftr-panel hidden">
    <h3>VIEW LOCATION<button class="panel-close" type="button" aria-label="Close">&#10005;</button></h3>
    <label for="loc-latlon">Location (lat, lon)</label>
    <input id="loc-latlon" placeholder="-33.8688, 151.2093">
    <button id="loc-gps" type="button">Use my location</button>
    <label for="loc-radius">Overhead radius NM</label>
    <input id="loc-radius" type="number" min="1" max="30" placeholder="5">
    <label for="loc-area">Area radius NM</label>
    <input id="loc-area" type="number" min="10" max="250" placeholder="60">
    <label for="loc-airport">Airport code</label>
    <input id="loc-airport" maxlength="4" placeholder="BNE">
    <label for="loc-token">Device token (only if the server requires one)</label>
    <input id="loc-token" placeholder="leave blank unless asked">
    <div class="loc-row">
      <button id="loc-save" type="button">Save</button>
      <button id="loc-clear" type="button">Server default</button>
    </div>
    <p id="loc-note"></p>
  </div>

  <script src="/static/vendor/leaflet.js?v=1.9.4"></script>
  <script src="/static/app.js?v=39"></script>
</body>
</html>
